name: Daily PubMed sync

on:
  # schedule disabled - rebuilding the collection from scratch manually
  # (fresh MeSH scope, dropped/re-added sources), re-enable once that's done:
  # schedule:
  #   - cron: "0 6 * * *"  # 06:00 UTC daily
  workflow_dispatch: {}  # manual "Run workflow" button still works

permissions:
  contents: write  # needed to commit sync_history.jsonl back to the repo

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          
      - name: Set up Python
        run: uv python install 3.12

      - name: Create virtual environment
        run: uv venv

      - name: Install torch (CPU-only, avoids the multi-GB CUDA build - runners have no GPU)
        run: uv pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install remaining dependencies
        # inline, not pyproject.toml's `uv sync` - that file pins torch to the
        # CUDA index for local GPU dev, which would fight the CPU install above
        run: uv pip install qdrant-client requests python-dotenv pypdf transformers huggingface_hub fastapi uvicorn pydantic

      - name: Run incremental sync
        env:
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          NCBI_EMAIL: ${{ secrets.NCBI_EMAIL }}
          UNPAYWALL_EMAIL: ${{ secrets.UNPAYWALL_EMAIL }}
        # -m, not a script path - the code is a package now (core/clients/services/
        # jobs/ingestion), running `python jobs/sync.py` directly puts jobs/ on
        # sys.path instead of the repo root, so `from core.config import ...` fails
        run: uv run python -m jobs.sync

      - name: Recheck full text on previously abstract-only docs
        env:
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          NCBI_EMAIL: ${{ secrets.NCBI_EMAIL }}
          UNPAYWALL_EMAIL: ${{ secrets.UNPAYWALL_EMAIL }}
        run: uv run python -m jobs.recheck_fulltext

      - name: Drop preprints that have since been published elsewhere
        env:
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
        run: uv run python -m jobs.recheck_preprints

      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-log-${{ github.run_number }}
          path: logs/
          retention-days: 30

      - name: Commit sync history
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add logs/sync_history.jsonl
          git diff --cached --quiet || git commit -m "Update sync history [skip ci]"
          git push
